{% load i18n %}<fieldset class="photo-fields"><legend>{% translate "Photo and details" %}</legend>{{ form.non_field_errors }}<div class="field-grid">{% for field in form %}{% if field.is_hidden %}{{ field }}{{ field.errors }}{% else %}<div class="field-group"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{{ field }}{{ field.errors }}{% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}</div>{% endif %}{% endfor %}</div><div class="form-actions"><button type="button" class="secondary-button" data-capture-gps>{% translate "Use current GPS" %}</button><button type="button" class="quiet-button" data-clear-gps>{% translate "Clear GPS" %}</button><button type="button" class="quiet-button" data-remove-photo>{% translate "Remove photo row" %}</button></div><p data-gps-status role="status"></p></fieldset>
