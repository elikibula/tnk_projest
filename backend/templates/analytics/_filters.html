<form method="get" class="app-card filter-card analytics-filters"><div class="filter-grid"><label>Reporting period<select name="period">{% for period in periods %}<option value="{{ period.pk }}"{% if selected_period.pk == period.pk %} selected{% endif %}>{{ period }}</option>{% endfor %}</select></label><label>Compare with<select name="compare_period"><option value="">Previous period</option>{% for period in periods %}<option value="{{ period.pk }}"{% if comparison_period.pk == period.pk %} selected{% endif %}>{{ period }}</option>{% endfor %}</select></label><div class="filter-actions"><button class="primary-button" type="submit">Apply periods</button></div></div><p class="field-help"><strong>Data scope:</strong> {{ data_scope_label }}</p></form>
